# The dockge stack for iheartrss.com (plan §9).
#
# Dockge is a web UI over compose. You create a stack in the UI and paste this in;
# dockge writes it to /opt/stacks/iheartrss/compose.yaml along with the .env you
# enter beside it. There is NO clone of this repo on the box, so:
#
#   * the image is PULLED, never built here — `build:` would have nothing to build
#   * blog posts come from inside the image, not a bind mount
#   * `./data` is resolved relative to the stack directory, and dockge creates it
#     on first up (see the one prerequisite below)
#
# TLS is terminated by the existing reverse proxy, not here.
#
# ONE THING TO DO BEFORE THE FIRST START, from dockge's terminal (or ssh), in
# /opt/stacks/iheartrss:
#
#   mkdir -p data && sudo chown 1000:1000 data
#
# The chown is not optional: the container runs as uid 1000 and Docker creates a
# missing bind-mount target as root, so boot fails with EACCES.
#
# Everything else, IP_HMAC_KEY included, goes in the .env you paste into dockge
# beside this file — there is no secret file to create over ssh first.
#
# See README.md, "Deploying".

services:
  iheartrss:
    # Pinned by version, set in .env. Not `latest`: "the previous latest" is not
    # something you can name at 2am, and rolling back is the whole reason images
    # are published. Publish with `pnpm docker:build-push` (multi-arch, amd64 +
    # arm64). See RUNBOOK.md, "Roll back to a previous image".
    image: ghcr.io/andrewshell/iheartrss:${IHEARTRSS_TAG:-latest}
    container_name: iheartrss
    restart: unless-stopped

    # Reaps zombies and forwards signals. The app handles SIGTERM itself, but
    # PID 1 duties are not the app's job.
    init: true

    mem_limit: 512m
    pids_limit: 256
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]

    # json-file is unbounded by default; left alone it fills the disk and takes
    # SQLite down with it.
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

    ports:
      # 127.0.0.1, NEVER 3000:3000. Docker inserts its own nat rules ahead of
      # ufw/firewalld, so publishing on 0.0.0.0 puts the app on the public
      # internet *beside* the reverse proxy rather than behind it. Combined with
      # TRUST_PROXY=true, anyone connecting directly could then set
      # X-Forwarded-For to anything — defeating every rate limit, poisoning every
      # logged IP hash, and exposing /admin over plaintext.
      #
      # Both sides follow PORT, so an operator who sets it in .env gets a mapping
      # that still reaches the app. Hardcoding 3000 here made PORT a knob that
      # .env.example documents and this file silently ignores.
      - '127.0.0.1:${PORT:-3000}:${PORT:-3000}'

    # Everything operator-specific lives in the .env dockge manages beside this
    # file: SITE_URL, ADMIN_TOKEN, IP_HMAC_KEY, IHEARTRSS_TAG, HEALTHCHECK_PING_URL,
    # and any knob from .env.example you want to override. See .env.example for the
    # full list with defaults.
    env_file:
      - .env

    # Only the values that are a property of running in THIS container, rather
    # than an operator preference, are hardcoded here.
    environment:
      - NODE_ENV=production
      # `environment` beats `env_file`, so a literal PORT=3000 here overrode whatever
      # the operator put in .env — the app kept listening on 3000 while every other
      # part of the stack was told otherwise. It defaults rather than disappears,
      # because the port is still a property of this container when nobody sets it.
      - PORT=${PORT:-3000}
      - DATABASE_PATH=/data/iheartrss.db
      # Behind the reverse proxy. One proxy in front means 0 hops past the
      # rightmost XFF entry, not 1 — see §6 and .env.example.
      - TRUST_PROXY=true
      - TRUSTED_PROXY_HOPS=0

    volumes:
      # Must exist and be owned by uid 1000 before the first start. Nightly
      # backups land in ./data/backups/YYYY-MM-DD.db (§9), so this directory is
      # what an off-box copy has to pull. The IP HMAC key is NOT in here — it is
      # in the .env, which is backed up separately (see RUNBOOK.md).
      - ./data:/data
      # No ./content mount. Posts ship in the image — a bind mount here would mask
      # them with an empty directory on a box that has no repo, which is exactly
      # how the blog silently renders empty.

    healthcheck:
      # Only the HTTP status is inspected, which is why /healthz answers 503
      # rather than a 200 carrying {ok:false}.
      #
      # The port is read from the container's own PORT, never written literally: a
      # hardcoded 3000 checks a port nothing is listening on as soon as anyone
      # changes it, and reports that as "unhealthy" — the app looks broken when only
      # the probe is. `process.env.PORT` rather than a `$PORT` expansion on purpose:
      # CMD (not CMD-SHELL) has no shell to expand it, and compose would substitute a
      # literal `$PORT` itself, from the HOST environment, before the container ever
      # sees this line.
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 60s
      timeout: 5s
      retries: 3
      # Boot is fast, but a cold first check should not spend a retry.
      start_period: 15s

networks: {}
