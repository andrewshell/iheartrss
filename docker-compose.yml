# The dockge stack for iheartrss.com (plan §9).
#
# Dockge builds from the stack directory, so this file lives at the root of a
# clone in /opt/stacks/iheartrss and dockge's compose editor picks it up.
# Secrets go in a `.env` beside this file. TLS is terminated by the existing
# reverse proxy, not here.
#
# Before the first `up`, on the host, in this directory:
#
#   mkdir -p data content && sudo chown 1000:1000 data
#   mkdir -p secrets && head -c 32 /dev/urandom | base64 > secrets/ip_hmac_key
#   chmod 600 secrets/ip_hmac_key
#
# See README.md, "Deploying". Skipping the chown is the failure §9 predicts.

services:
  iheartrss:
    # Two ways to get the image, and they are mutually exclusive.
    #
    # `build: .` builds the working tree on this box. Convenient, but it means the
    # only version that exists is whatever is checked out here — so a bad deploy is
    # recovered by `git checkout` and a rebuild at 2am (§9).
    #
    # The `image:` line deploys a tag published by .github/workflows/publish.yml,
    # which is what makes rollback a one-line edit. To switch: comment out `build:`,
    # uncomment `image:`, and put `IHEARTRSS_TAG=main-<short-sha>` in the .env beside
    # this file. Pin an actual tag, not `latest` — "the previous latest" is not a
    # thing you can name. See RUNBOOK.md, "Roll back to a previous image".
    build: .
    # image: ghcr.io/andrewshell/iheartrss:${IHEARTRSS_TAG:-latest}
    container_name: iheartrss
    restart: unless-stopped

    # Reaps zombies and forwards signals. The app handles SIGTERM itself, but
    # PID 1 duties are not the app's job.
    init: true

    mem_limit: 512m
    pids_limit: 256
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

    # json-file is unbounded by default; left alone it fills the disk and takes
    # SQLite down with it.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      # 127.0.0.1, NEVER 3000:3000. Docker inserts its own nat rules ahead of
      # ufw/firewalld, so publishing on 0.0.0.0 puts the app on the public
      # internet *beside* the reverse proxy rather than behind it. Combined with
      # TRUST_PROXY=true, anyone connecting directly could then set
      # X-Forwarded-For to anything — defeating every rate limit, poisoning every
      # logged IP hash, and exposing /admin over plaintext.
      - "127.0.0.1:3000:3000"

    environment:
      - NODE_ENV=production
      - PORT=3000
      - SITE_URL=https://iheartrss.com
      - DATABASE_PATH=/data/iheartrss.db
      - TRUST_PROXY=true
      # One reverse proxy in front means 0 hops past the rightmost XFF entry,
      # not 1 — see §6 and .env.example. Read from phase 5.
      - TRUSTED_PROXY_HOPS=0
      # Consumed from phase 5 (admin) and phase 4 (IP hashing). Harmless now.
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - IP_HMAC_KEY_FILE=/run/secrets/ip_hmac_key

      # §9's alerting. A healthchecks.io (or self-hosted) ping URL, pinged at the
      # end of every revalidation batch — it covers "container dead" and "scheduler
      # wedged" at once, which `restart: unless-stopped` otherwise turns into a
      # silent crash loop you hear about from a member's email. Unset = no ping.
      - HEALTHCHECK_PING_URL=${HEALTHCHECK_PING_URL:-}

      # Passed through with their defaults so they can be changed in the .env beside
      # this file without editing the compose file. REVALIDATE_BATCH is the knob
      # RUNBOOK.md tells you to turn when /healthz shows a growing overdue_count.
      - REVALIDATE_BATCH=${REVALIDATE_BATCH:-20}
      # Nightly ./data/backups/YYYY-MM-DD.db, pruned past this many days (§9).
      - BACKUP_RETENTION_DAYS=${BACKUP_RETENTION_DAYS:-14}

    volumes:
      # Must exist and be owned by uid 1000 before the first start. Nightly backups
      # land in ./data/backups/YYYY-MM-DD.db (§9), so this directory is what an
      # off-box copy has to pull. NOT together with ./secrets — see below.
      - ./data:/data
      # Blog posts (phase 7): drop a .md file in to publish, no rebuild needed.
      # This mount masks anything baked into the image at /app/content, which is
      # why content/ is in .dockerignore — the bind mount is the publishing path.
      - ./content:/app/content:ro
      # NOT under ./data: the IP HMAC key living beside the database it protects
      # would travel with it in one backup tarball, defeating the point.
      - ./secrets/ip_hmac_key:/run/secrets/ip_hmac_key:ro

    healthcheck:
      # Only the HTTP status is inspected, which is why /healthz answers 503
      # rather than a 200 carrying {ok:false}.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 5s
      retries: 3
      # Boot is fast, but a cold first check should not spend a retry.
      start_period: 15s
