# release-please keeps a "chore(main): release x.y.z" PR open on main, accumulating
# every conventional commit that lands. Merging that PR bumps package.json, writes
# CHANGELOG.md, and tags `v<x.y.z>`.
#
# Versions are derived from commit messages, so commits MUST follow Conventional
# Commits (`feat:`, `fix:`, `feat!:` …). .husky/commit-msg enforces this locally.
#
# It does NOT publish a container image. That is done deliberately from a
# workstation with `pnpm docker:build-push`, which builds linux/amd64 AND
# linux/arm64 -- GitHub's runners are amd64-only, so automating it here would
# publish half of what production needs. Merging a release PR should not be able
# to ship an image on its own.

name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
