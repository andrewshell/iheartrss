# release-please keeps a "chore(main): release x.y.z" PR open on main, accumulating
# every conventional commit that lands. Merging that PR bumps package.json, writes
# CHANGELOG.md, and tags `v<x.y.z>`.
#
# Versions are derived from commit messages, so commits MUST follow Conventional
# Commits (`feat:`, `fix:`, `feat!:` …). .husky/commit-msg enforces this locally.
#
# When that merge creates a release, the `publish` job builds the image for
# linux/amd64 and linux/arm64 (arm64 under QEMU) from the tagged commit and pushes
# `ghcr.io/andrewshell/iheartrss:<version>` and `:latest`. It lives in this
# workflow rather than in one triggered by the tag because tags pushed with
# GITHUB_TOKEN do not trigger other workflows. `pnpm docker:build-push` remains
# the manual fallback.

name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Tests
        run: pnpm test

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true
          tags: |
            ghcr.io/andrewshell/iheartrss:${{ needs.release-please.outputs.version }}
            ghcr.io/andrewshell/iheartrss:latest
