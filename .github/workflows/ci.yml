# Quality gate for pull requests and for main: lint, formatting, and the test
# suite on the Node versions this project supports.
#
# Deliberately no Docker here. The image is built and pushed from a workstation
# with `pnpm docker:build-push`, which builds linux/amd64 AND linux/arm64 --
# GitHub's runners are amd64, so a CI build could only ever cover half of what
# actually ships. Publishing is a deliberate act, not a side effect of merging.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format & tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # 26 is a forward-looking canary, not a deploy target. Without fail-fast
      # off, a break there would cancel the 24 job and hide the result that
      # actually matters.
      fail-fast: false
      matrix:
        # `engines.node` is >=24 and the app is built on `node:sqlite`, which
        # does not exist on 22 — so 22 is not in this list and must not be.
        node: ['24', '26']
    steps:
      - uses: actions/checkout@v7

      # Provides the pnpm version pinned in package.json's `packageManager`,
      # and must run before setup-node so `cache: 'pnpm'` can find pnpm.
      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Tests
        run: pnpm test
