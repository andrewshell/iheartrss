# Publish a released image to GHCR (plan §9, "Rollback needs tagged images").
#
# The problem this solves: `build: .` in docker-compose.yml means the only version
# that exists is the working tree on the production box. A bad deploy is then
# recovered by `git checkout` and a rebuild — at 2am, with the site down, on the
# machine you are trying not to touch. With published tags, rollback is editing one
# line in the compose file and redeploying.
#
# WHEN THIS RUNS. Images correspond to releases, not to commits. release-please
# maintains a release PR on main; merging it bumps the version, writes CHANGELOG.md
# and tags `v<x.y.z>`, and then release-please.yml calls THIS workflow with that
# tag. Nothing publishes on an ordinary push to main — ci.yml is the gate there.
#
# It is *called* rather than triggered by the tag on purpose: a tag pushed by the
# built-in GITHUB_TOKEN does not start a new workflow run, so a `push: tags:` trigger
# alone would silently never fire. The `push: tags:` trigger below is kept for tags
# pushed by a human, and workflow_dispatch for rebuilding an older release.
#
# What gets published for `v1.2.3`:
#
#   ghcr.io/andrewshell/iheartrss:1.2.3   <- deploy and roll back by this
#   ghcr.io/andrewshell/iheartrss:1.2
#   ghcr.io/andrewshell/iheartrss:1
#   ghcr.io/andrewshell/iheartrss:latest
#
# Pin the compose file to an exact version, never `latest`: rolling back to "the
# previous latest" is not a thing you can name.
#
# For an image WITHOUT cutting a release, use ./scripts/docker-build-push.sh from a
# workstation. That is the deliberate out-of-band path.

name: publish

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to build and publish, e.g. v1.2.3'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish, e.g. v1.2.3'
        required: true
        type: string
  push:
    tags: ['v*']

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Enable corepack
        run: corepack enable

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # An image nobody can roll back *from* is not much better than no image.
      # ci.yml already ran on main, but this job is what vouches for the exact
      # tree being tagged, so it stays.
      - run: pnpm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with the automatic GITHUB_TOKEN.
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # `value=` is spelled out rather than relying on the triggering ref,
          # because on a workflow_call from release-please the ref is main, not
          # the tag, and the semver patterns would resolve to nothing.
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag || github.ref_name }}
            type=semver,pattern={{major}},value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.description=A webring-style directory for people who love RSS.

      # linux/amd64 only. The deployment target is one x86 VPS; a QEMU-emulated
      # arm64 build would roughly triple the job for nothing. Add
      # `platforms: linux/amd64,linux/arm64` here if that changes.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
