# Publish a tagged image to GHCR (plan §9, "Rollback needs tagged images").
#
# The problem this solves: `build: .` in docker-compose.yml means the only version
# that exists is the working tree on the production box. A bad deploy is then
# recovered by `git checkout` and a rebuild — at 2am, with the site down, on the
# machine you are trying not to touch. With published tags, rollback is editing one
# line in the compose file and redeploying.
#
# What gets published, on every push to main:
#
#   ghcr.io/andrewshell/iheartrss:latest
#   ghcr.io/andrewshell/iheartrss:main-<short-sha>   <- deploy and roll back by this
#
# and on a `v*` tag, additionally `:v1.2.3`, `:1.2`, `:1`.
#
# Pin the compose file to a `main-<sha>` (or a `v*`) tag rather than `latest`:
# rolling back to "the previous latest" is not a thing you can name.

name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  # So a rollback target can be built from an older commit without pushing a tag.
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # An image nobody can roll back *from* is not much better than no image.
      - run: pnpm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required to push to GHCR with the automatic GITHUB_TOKEN.
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=main-,format=short,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.description=A webring-style directory for people who love RSS.

      # linux/amd64 only. The deployment target is one x86 VPS; a QEMU-emulated
      # arm64 build would roughly triple the job for nothing. Add
      # `platforms: linux/amd64,linux/arm64` here if that changes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
